#  base64 -w 0 /etc/docker/certs.d/registry.corp.internal:8888/registry.corp.internal.cert | base64 -w 0
#
apiVersion: v1
data:
  registry-cert: 
kind: Secret
metadata:
  name: air-wl01-user-trusted-ca-secret
  namespace: air
type: Opaque
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: air-wl01
  namespace: air
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/16
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    version: v1.35.0---vmware.2-vkr.4
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: "os-name=ubuntu,os-version=24.04"
    workers:
      machineDeployments:
        - class: node-pool
          name: k8s-air-np01
          replicas: 1
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: "os-name=ubuntu,os-version=24.04"
    variables:
      - name: vmClass
        value: k8s-master-demo
      - name: storageClass
        value: vks-storage-policy
      - name: kubernetes
        value:
          etcdConfiguration:
            maximumDBSizeGiB: 5
          security:
            podSecurityStandard:
              audit: "privileged"                           
              auditVersion: "latest"                         
              enforce: "privileged"                          
              enforceVersion: "latest"                       
              warn: "privileged"                            
              warnVersion: "latest"                         
          certificateRotation:
            enabled: true
            renewalDaysBeforeExpiry: 90
      - name: osConfiguration
        value:
          ntp:
            servers:
            - "ntp.broadcom.net"
          sshd:
            banner: "Security Warning Accessing the carbon-wl01 cluster"
          trust:
            additionalTrustedCAs:
            - caCert:
                secretRef:
                  name: "air-wl01-user-trusted-ca-secret"
                  key: registry-cert
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: air-wl01-cert-manager
  namespace: air
  annotations:
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
spec:
  addonRef:
    name: cert-manager
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: air-wl01
---

