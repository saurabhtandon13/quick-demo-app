#  base64 -w 0 /etc/docker/certs.d/registry.corp.internal:8888/registry.corp.internal.cert | base64 -w 0
#
apiVersion: v1
data:
  registry-cert: 
kind: Secret
metadata:
  name: carbon-wl01-user-trusted-ca-secret
  namespace: carbon
type: Opaque
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: carbon-wl01
  namespace: carbon
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/16
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    version: v1.35.0---vmware.2-vkr.4
    controlPlane:
      replicas: 3
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: "os-name=ubuntu,os-version=24.04"
    workers:
      machineDeployments:
        - class: node-pool
          name: k8s-carbo-np01
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: "os-name=ubuntu,os-version=24.04"
              cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "3"
              cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "5"
          deletion:
            order: Oldest
          rollout:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 1
          variables:
            overrides:
            - name: vmClass
              value: k8s-worker
    variables:
      - name: vmClass
        value: k8s-master
      - name: storageClass
        value: vks-storage-policy
      - name: kubernetes
        value:
          etcdConfiguration:
            maximumDBSizeGiB: 5
          security:
            podSecurityStandard:
              audit: "privileged"                           
              auditVersion: "latest"                         
              enforce: "privileged"                          
              enforceVersion: "latest"                       
              warn: "privileged"                            
              warnVersion: "latest"                         
          certificateRotation:
            enabled: true
            renewalDaysBeforeExpiry: 90
      - name: osConfiguration
        value:
          ntp:
            servers:
            - "ntp.broadcom.net"
          sshd:
            banner: "Security Warning Accessing the carbon-wl01 cluster"
          trust:
            additionalTrustedCAs:
            - caCert:
                secretRef:
                  name: "carbon-wl01-user-trusted-ca-secret"
                  key: registry-cert
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: carbon-wl01-cert-manager
  namespace: carbon
  annotations:
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
spec:
  addonRef:
    name: cert-manager
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: carbon-wl01
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: carbon-wl01-prometheus
  namespace: carbon # Your vSphere namespace
spec:
  addonRef:
    name: prometheus
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: carbon-wl01
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  annotations:
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
  name: carbon-wl01-prometheus
  namespace: carbon  # Your vSphere namespace
spec:
  values:
    deploycomponents:
      kube-state-metrics: true
      node-exporter: true
      pushgateway: true
      prometheus: true
      alertmanager: true
      prometheus-operator: false
    alertmanager:
      pvc:
        accessMode: ReadWriteOnce
        storage: 2Gi
        storageClassName: vks-storage-policy
    prometheus:
      pvc:
        accessMode: ReadWriteOnce
        storage: 15Gi
        storageClassName: vks-storage-policy
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: carbon-wl01-istio
  namespace: carbon # Your vSphere namespace
spec:
  addonRef:
    name: istio
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: carbon-wl01
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  annotations:
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
  name: carbon-wl01-istio
  namespace: carbon  # Your vSphere namespace
spec:
  clusterName: carbon-wl01
  values:
    istio:
      namespace: "istio-system"
      ambientMode:
        enabled: true
        ztunnel:
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
      istioCNI:
        enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
      enableStrictMTLS: false
      gateways:
        egress:
          enabled: true
          namespace: "istio-egress"
          priorityClassName: ""
          replicas: 1
          resources:
            limits:
              cpu: 2000m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 128Mi
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
        ingress:
          enabled: true
          namespace: "istio-ingress"
          priorityClassName: ""
          replicas: 1
          resources:
            limits:
              cpu: 2000m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 128Mi
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
      pilot:
        priorityClassName: ""
        replicas: 1
        resources:
          requests:
            cpu: 500m
            memory: 2048Mi
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 5
      support:
        priorityClassName: ""
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      meshConfig:
        connectTimeout: "10s"
        ingressControllerMode: "STRICT"
        accessLogFile: ""
        trustDomain: "cluster.local"
        trustDomainAliases: []
        enablePrometheusMerge: true
        meshID: "carbon-wl01"
        meshMTLS:
          minProtocolVersion: "TLSV1_2"
        enableDNSProxy: false
        proxy:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
        waypoint:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
        enableTracing: true
        extensionProviders:
          - name: jaeger
            opentelemetry:
              port: 4317
              service: jaeger-collector.istio-system.svc.cluster.local
          - name: zipkin
            zipkin:
              port: 4317
              service: jaeger-collector.istio-system.svc.cluster.local
        defaultProviders:
          tracing:
            - jaeger
